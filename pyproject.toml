[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindlemcp"
version = "0.2.0"
description = "Send documents to a Kindle via Amazon Send-to-Kindle (email). CLI + MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Azamat Zhamanov" }]
keywords = ["kindle", "mcp", "send-to-kindle", "epub", "pandoc"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
# pandoc is an external binary (only needed for Markdown input), NOT a pip
# dependency — install it separately, e.g. `brew install pandoc`.
# Pinned to the 1.x line: this server targets the FastMCP API
# (mcp.server.fastmcp.FastMCP), which was renamed in mcp 2.x.
dependencies = [
    "mcp>=1.2.0,<2",
    # The remote HTTP transport (kindlemcp-http) serves the MCP streamable-HTTP
    # ASGI app with uvicorn. Starlette itself comes in transitively via mcp.
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
kindlemcp-send = "kindlemcp.cli:main"
kindlemcp = "kindlemcp.mcp_server:main"
kindlemcp-http = "kindlemcp.http_server:main"

[project.urls]
Homepage = "https://github.com/zhamanov-seabus/send-to-kindle"

[tool.hatch.build.targets.wheel]
packages = ["src/kindlemcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# landing.py is a single embedded HTML template; long markup lines are inherent.
"src/kindlemcp/landing.py" = ["E501"]
